inputs:
  gpkg_path: data/surfaces.gpkg
  layer: surfaces
  building_id_field: building_id
  class_field: surface_type
  default_class: default

tiling:
  tile_size: 250.0
  root_geometric_error:
  no_elevation: false
  with_metadata: false
  overwrite: true

artifacts:
  output_dir: output/default

styles:
  class_colors:
    GROUNDSURFACE: "#C8E8B0"
    OUTERCEILING: "#D8DDE6"
    OUTERFLOOR: "#B8A37A"
    ROOFSURFACE: "#CC2222"
    WALLSURFACE: "#888888"
