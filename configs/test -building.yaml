inputs:
  gpkg_path: input/saintjosse.gpkg
  layer: EngineeringWorkFaces
  building_id_field: ENWSOLID_ID
  class_field: TYPE
  default_class: default

tiling:
  tile_size: 800
  root_geometric_error:
  no_elevation: true
  with_metadata: true
  overwrite: true

artifacts:
  output_dir: output/test

styles:
  class_colors:
    GROUNDSURFACE: "#C8E8B0"
    OUTERCEILING: "#D8DDE6"
    OUTERFLOOR: "#B8A37A"
    ROOFSURFACE: "#CC2222"
    WALLSURFACE: "#888888"
